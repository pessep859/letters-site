<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Письма поддержки — Генератор заявок</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--neon-pink:#FF006B;--neon-pink-glow:rgba(255,0,107,0.4);--bg-dark:#0a0a0f;--bg-card:rgba(21,21,32,0.85);--bg-glass:rgba(255,255,255,0.03);--text-primary:#ffffff;--text-secondary:#a0a0b0;--border:rgba(255,255,255,0.08)}
body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg-dark);color:var(--text-primary);min-height:100vh;line-height:1.6;position:relative}
body::before{content:'';position:fixed;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(255,0,107,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,0,107,0.03) 1px,transparent 1px);background-size:50px 50px;pointer-events:none;z-index:0}
.bg-tree{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:min(110vw,1100px);height:min(110vw,1100px);background:url('tree.png') center/contain no-repeat;opacity:0.12;pointer-events:none;z-index:0;filter:brightness(1.8) contrast(1.1)}
.container{max-width:1200px;margin:0 auto;padding:40px 20px;position:relative;z-index:1}
.header{text-align:center;margin-bottom:50px;padding:40px 0}
.header h1{font-size:3rem;font-weight:800;letter-spacing:-1px;margin-bottom:12px;background:linear-gradient(135deg,#fff 0%,var(--neon-pink) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.header p{color:var(--text-secondary);font-size:1.1rem}
.neon-line{width:120px;height:3px;background:var(--neon-pink);margin:20px auto 0;border-radius:2px;box-shadow:0 0 20px var(--neon-pink-glow),0 0 40px var(--neon-pink-glow)}
.section{margin-bottom:50px}
.section-title{font-size:1.5rem;font-weight:700;margin-bottom:24px;display:flex;align-items:center;gap:12px}
.section-title::before{content:'';width:4px;height:24px;background:var(--neon-pink);border-radius:2px;box-shadow:0 0 10px var(--neon-pink-glow)}
.form-card{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:32px;backdrop-filter:blur(20px);margin-bottom:30px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:20px;margin-bottom:24px}
.form-group{display:flex;flex-direction:column;gap:8px}
.form-group.full-width{grid-column:1/-1}
.form-group label{font-size:0.85rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px}
.form-group input,.form-group textarea{background:var(--bg-glass);border:1px solid var(--border);border-radius:12px;padding:14px 16px;color:var(--text-primary);font-size:1rem;font-family:inherit;transition:all 0.3s ease;outline:none}
.form-group input:focus,.form-group textarea:focus{border-color:var(--neon-pink);box-shadow:0 0 0 3px var(--neon-pink-glow)}
.form-group textarea{min-height:120px;resize:vertical}
.orgs-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px;margin:24px 0}
.org-item{background:var(--bg-glass);border:1px solid var(--border);border-radius:16px;padding:16px;cursor:pointer;transition:all 0.3s ease;display:flex;align-items:center;gap:12px;user-select:none}
.org-item:hover{border-color:rgba(255,0,107,0.3);transform:translateY(-2px)}
.org-item.active{border-color:var(--neon-pink);background:rgba(255,0,107,0.08);box-shadow:0 0 20px rgba(255,0,107,0.1)}
.heart{width:28px;height:28px;flex-shrink:0;position:relative;transition:transform 0.3s cubic-bezier(0.175,0.885,0.32,1.275)}
.heart svg{width:100%;height:100%;fill:none;stroke:var(--text-secondary);stroke-width:2;transition:all 0.3s ease}
.org-item.active .heart{transform:scale(1.15)}
.org-item.active .heart svg{fill:var(--neon-pink);stroke:var(--neon-pink);filter:drop-shadow(0 0 8px var(--neon-pink-glow))}
.org-name{font-size:0.95rem;font-weight:600;color:var(--text-secondary);transition:color 0.3s ease;font-family:'Courier New',monospace;letter-spacing:0.5px}
.org-item.active .org-name{color:var(--text-primary)}
.btn{background:linear-gradient(135deg,var(--neon-pink),#d4005c);color:white;border:none;padding:16px 32px;border-radius:14px;font-size:1rem;font-weight:700;cursor:pointer;transition:all 0.3s ease;box-shadow:0 4px 20px rgba(255,0,107,0.3);font-family:inherit}
.btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(255,0,107,0.5)}
.btn:active{transform:translateY(0)}
.btn-secondary{background:transparent;border:1px solid var(--border);color:var(--text-secondary);box-shadow:none}
.btn-secondary:hover{border-color:var(--neon-pink);color:var(--neon-pink);box-shadow:0 0 20px rgba(255,0,107,0.15)}
.buttons-row{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}
.output-box{background:rgba(0,0,0,0.4);border:1px solid var(--border);border-radius:16px;padding:20px;margin-top:24px;font-family:'Courier New',monospace;font-size:0.9rem;color:var(--text-secondary);white-space:pre-wrap;word-break:break-all;display:none;position:relative;cursor:pointer}
.output-box.show{display:block;animation:fadeIn 0.4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.copy-hint{position:absolute;top:12px;right:16px;font-size:0.75rem;color:var(--neon-pink);opacity:0;transition:opacity 0.3s}
.output-box:hover .copy-hint{opacity:1}
.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:24px}
.card{background:var(--bg-card);border:1px solid var(--border);border-radius:20px;padding:28px;backdrop-filter:blur(20px);transition:all 0.3s ease;position:relative;overflow:hidden}
.card::before{content:'';position:absolute;top:0;left:0;width:100%;height:3px;background:linear-gradient(90deg,var(--neon-pink),transparent);opacity:0;transition:opacity 0.3s}
.card:hover{border-color:rgba(255,0,107,0.2);transform:translateY(-4px);box-shadow:0 20px 40px rgba(0,0,0,0.4)}
.card:hover::before{opacity:1}
.card-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:16px}
.card-title{font-size:1.15rem;font-weight:700;line-height:1.4;flex:1;padding-right:12px}
.card-number{background:rgba(255,0,107,0.1);color:var(--neon-pink);font-size:0.8rem;font-weight:700;padding:6px 12px;border-radius:8px;border:1px solid rgba(255,0,107,0.2);white-space:nowrap}
.card-author{color:var(--text-secondary);font-size:0.95rem;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card-author::before{content:'👤'}
.card-desc{color:var(--text-secondary);font-size:0.9rem;line-height:1.6;margin-bottom:20px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.card-orgs{display:flex;flex-wrap:wrap;gap:8px}
.card-org-tag{background:rgba(255,0,107,0.08);color:var(--neon-pink);font-size:0.75rem;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid rgba(255,0,107,0.15)}
.card-org-tag.done{background:rgba(120,230,150,0.08);color:#78e696;border-color:rgba(120,230,150,0.2)}
.stats{display:flex;gap:24px;margin-bottom:40px;flex-wrap:wrap}
.stat-item{background:var(--bg-card);border:1px solid var(--border);border-radius:16px;padding:20px 28px;min-width:160px}
.stat-value{font-size:2rem;font-weight:800;color:var(--neon-pink);text-shadow:0 0 20px var(--neon-pink-glow)}
.stat-label{color:var(--text-secondary);font-size:0.85rem;margin-top:4px}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-track{background:var(--bg-dark)}
::-webkit-scrollbar-thumb{background:var(--neon-pink);border-radius:4px}
.toast{position:fixed;bottom:30px;right:30px;background:var(--bg-card);border:1px solid var(--neon-pink);color:var(--text-primary);padding:16px 24px;border-radius:14px;box-shadow:0 10px 40px rgba(255,0,107,0.2);transform:translateY(100px);opacity:0;transition:all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);z-index:1000;font-weight:600}
.toast.show{transform:translateY(0);opacity:1}
.loading{display:inline-block;width:20px;height:20px;border:2px solid rgba(255,0,107,0.3);border-top-color:var(--neon-pink);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.status-bar{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:12px;font-size:0.9rem;font-weight:600;margin-bottom:16px}
.status-bar.ok{background:rgba(120,230,150,0.1);color:#78e696;border:1px solid rgba(120,230,150,0.2)}
.status-bar.err{background:rgba(255,107,107,0.1);color:#ff6b6b;border:1px solid rgba(255,107,107,0.2)}
.status-bar.loading{background:rgba(255,0,107,0.08);color:var(--neon-pink);border:1px solid rgba(255,0,107,0.2)}
.last-update{color:var(--text-secondary);font-size:0.8rem;margin-left:auto}
@media(max-width:768px){.header h1{font-size:2rem}.cards-grid{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.bg-tree{width:110vw;height:110vw}}
</style>
</head>
<body>
<div class="bg-tree"></div>
<div class="container">
<header class="header">
<h1>Письма поддержки</h1>
<p>Интерактивный генератор заявок для Google Таблицы</p>
<div class="neon-line"></div>
</header>

<div id="connection-status" class="status-bar loading">
<div class="loading"></div> Загрузка данных из таблицы...
</div>

<div class="stats">
<div class="stat-item"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Всего заявок</div></div>
<div class="stat-item"><div class="stat-value" id="stat-orgs">0</div><div class="stat-label">Организаций</div></div>
<div class="stat-item"><div class="stat-value" id="stat-letters">0</div><div class="stat-label">Всего писем</div></div>
</div>

<div class="section">
<h2 class="section-title">Новая заявка</h2>
<div class="form-card">
<div class="form-grid">
<div class="form-group"><label>Название проекта</label><input id="inp-name" placeholder="Например: Студенческий фестиваль «ПРОФ.общага»"></div>
<div class="form-group"><label>ФИО автора</label><input id="inp-fio" placeholder="Иванов Иван Иванович"></div>
<div class="form-group"><label>Конкурс</label><input id="inp-contest" value="2 сезон"></div>
<div class="form-group"><label>Год</label><input id="inp-year" value="2026"></div>
<div class="form-group"><label>Номер заявки</label><input id="inp-number" placeholder="466"></div>
<div class="form-group"><label>Дата</label><input id="inp-date"></div>
<div class="form-group full-width"><label>Описание проекта</label><textarea id="inp-desc" placeholder="Опишите проект подробно..."></textarea></div>
</div>

<label style="font-size:0.85rem;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:0.5px;margin-bottom:16px;display:block;">Выберите организации для писем поддержки</label>
<div class="orgs-grid" id="orgs-selector"></div>

<div class="buttons-row">
<button class="btn" onclick="submitForm()" id="btn-submit">Отправить в таблицу</button>
<button class="btn btn-secondary" onclick="clearForm()">Очистить</button>
<button class="btn btn-secondary" onclick="loadData()" id="btn-refresh">Обновить данные</button>
</div>
</div>
</div>

<div class="section">
<h2 class="section-title">Существующие заявки</h2>
<div class="cards-grid" id="cards-container"></div>
</div>
</div>

<div class="toast" id="toast"></div>

<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbxnpvfA8iSSGQvFg0WugmvE3VmYG8jLDnQa1PbqsncwKjI-Tpf9i3VW1eoMJZstG5kX/exec';
let ORG_COLS = [];
let EXISTING_DATA = [];
let selectedOrgs = new Set();
let autoRefreshInterval = null;

function init(){
  document.getElementById('inp-date').value = new Date().toLocaleDateString('ru-RU');
  loadData();
  startAutoRefresh();
}

function startAutoRefresh(){
  if(autoRefreshInterval) clearInterval(autoRefreshInterval);
  autoRefreshInterval = setInterval(() => loadData(true), 30000);
}

function loadData(silent){
  if(!silent){
    const status = document.getElementById('connection-status');
    status.className = 'status-bar loading';
    status.innerHTML = '<div class="loading"></div> Загрузка данных из таблицы...';
  }
  fetch(API_URL, {method: 'GET', mode: 'cors'})
    .then(r => r.json())
    .then(data => {
      if(data.error){ showError(data.error); return; }
      ORG_COLS = data.orgCols || [];
      EXISTING_DATA = data.records || [];
      renderOrgSelector();
      renderCards();
      updateStats();
      const status = document.getElementById('connection-status');
      status.className = 'status-bar ok';
      status.innerHTML = '<span style="font-size:1.2rem">✓</span> Подключено к таблице · ' + EXISTING_DATA.length + ' заявок · ' + ORG_COLS.length + ' организаций<span class="last-update">Обновлено: ' + new Date().toLocaleTimeString('ru-RU') + '</span>';
      if(!silent) showToast('Данные загружены из таблицы');
    })
    .catch(err => {
      showError('Ошибка загрузки: ' + err.message);
      if(!silent) showToast('Ошибка загрузки данных');
    });
}

function showError(msg){
  const status = document.getElementById('connection-status');
  status.className = 'status-bar err';
  status.innerHTML = '<span style="font-size:1.2rem">✗</span> ' + escapeHtml(msg) + ' <button class="btn" onclick="loadData()" style="padding:6px 12px;font-size:0.8rem;margin-left:auto">Повторить</button>';
}

function renderOrgSelector(){
  const container = document.getElementById('orgs-selector');
  container.innerHTML = '';
  ORG_COLS.forEach(key => {
    const div = document.createElement('div');
    div.className = 'org-item';
    div.dataset.key = key;
    div.innerHTML = '<div class="heart"><svg viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg></div><span class="org-name">' + escapeHtml(key) + '</span>';
    div.onclick = function(){ toggleOrg(key, this); };
    container.appendChild(div);
  });
}

function toggleOrg(key, el){
  if(selectedOrgs.has(key)){
    selectedOrgs.delete(key);
    el.classList.remove('active');
  } else {
    selectedOrgs.add(key);
    el.classList.add('active');
  }
}

function submitForm(){
  const fio = document.getElementById('inp-fio').value.trim();
  const name = document.getElementById('inp-name').value.trim();
  const desc = document.getElementById('inp-desc').value.trim();
  const contest = document.getElementById('inp-contest').value.trim();
  const year = document.getElementById('inp-year').value.trim();
  const number = document.getElementById('inp-number').value.trim();
  const date = document.getElementById('inp-date').value.trim();
  if(!fio || !name){ showToast('Заполните ФИО и название проекта'); return; }

  const payload = {'ФИО': fio, 'Название': name, 'Описание': desc, 'Конкурс': contest, 'Год': year, 'Номер': number, 'Дата': date};
  ORG_COLS.forEach(org => { payload[org] = selectedOrgs.has(org) ? '1' : ''; });

  const btn = document.getElementById('btn-submit');
  const originalText = btn.textContent;
  btn.textContent = 'Отправка...';
  btn.disabled = true;

  fetch(API_URL, {
    method: 'POST',
    body: JSON.stringify(payload),
    headers: {'Content-Type': 'text/plain;charset=utf-8'}
  })
  .then(() => {
    showToast('Заявка отправлена в таблицу!');
    clearForm();
    setTimeout(() => loadData(), 1500);
  })
  .catch(err => {
    showToast('Ошибка отправки: ' + err.message);
  })
  .finally(() => {
    btn.textContent = originalText;
    btn.disabled = false;
  });
}

function clearForm(){
  document.getElementById('inp-fio').value = '';
  document.getElementById('inp-name').value = '';
  document.getElementById('inp-desc').value = '';
  document.getElementById('inp-number').value = '';
  selectedOrgs.clear();
  document.querySelectorAll('.org-item').forEach(el => el.classList.remove('active'));
}

function renderCards(){
  const container = document.getElementById('cards-container');
  container.innerHTML = EXISTING_DATA.map(item => {
    const activeOrgs = Object.keys(item.orgs || {}).filter(k => item.orgs[k]);
    const doneOrgs = Object.keys(item.done || {}).filter(k => item.done[k]);
    return '<div class="card"><div class="card-header"><div class="card-title">' + escapeHtml(item.name) + '</div><div class="card-number">№' + item.number + '</div></div><div class="card-author">' + escapeHtml(item.fio) + '</div><div class="card-desc">' + escapeHtml(item.desc) + '</div><div class="card-orgs">' + activeOrgs.map(org => '<span class="card-org-tag ' + (doneOrgs.includes(org) ? 'done' : '') + '">' + escapeHtml(org) + '</span>').join('') + '</div></div>';
  }).join('');
}

function updateStats(){
  let totalLetters = 0;
  EXISTING_DATA.forEach(item => { totalLetters += Object.values(item.orgs || {}).filter(v => v).length; });
  document.getElementById('stat-total').textContent = EXISTING_DATA.length;
  document.getElementById('stat-orgs').textContent = ORG_COLS.length;
  document.getElementById('stat-letters').textContent = totalLetters;
}

function escapeHtml(text){
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function showToast(msg){
  const toast = document.getElementById('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 3000);
}

init();
</script>
</body>
</html>
